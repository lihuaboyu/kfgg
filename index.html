<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>康复治疗学知识库</title>
<style>
:root{
  --bg:#f5f7f9; --panel:#fff; --ink:#1f2d3d; --muted:#6b7a8c;
  --line:#e2e8f0; --brand:#0f766e; --brand-soft:#ccfbf1; --accent:#c2410c;
  --accent-soft:#ffedd5; --doc:#2563eb; --vid:#7c3aed; --shadow:0 1px 3px rgba(15,40,60,.06),0 4px 16px rgba(15,40,60,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.75;font-size:15px}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}

header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;padding:12px 20px;box-shadow:var(--shadow)}
header h1{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
header h1 .logo{width:26px;height:26px;background:#fff;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#0f766e;font-weight:900;font-size:14px}
.search-wrap{margin-top:8px;position:relative}
.search-wrap input{width:100%;padding:8px 14px 8px 36px;border-radius:8px;border:none;font-size:14px;outline:none}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:#64748b}

.wrap{display:flex;max-width:1500px;margin:0 auto;height:calc(100vh - 86px)}
aside{width:290px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px 0}
main{flex:1;overflow-y:auto;padding:24px 36px;min-width:0}

.nav-group{margin-bottom:2px}
.nav-top{padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;border-left:3px solid transparent}
.nav-top:hover{background:#f1f5f9}
.nav-top .cnt{font-size:11px;color:var(--muted);font-weight:400;background:#eef2f7;padding:1px 7px;border-radius:10px}
.nav-items{display:none}
.nav-group.open .nav-items{display:block}
.nav-group.open>.nav-top{border-left-color:var(--brand);background:var(--brand-soft)}
.nav-sub{padding:6px 16px 6px 30px;font-size:13px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:6px;border-left:3px solid transparent}
.nav-sub:hover{background:#f0fdfa;color:var(--brand)}
.nav-sub.active{border-left-color:var(--accent);background:#fff7ed;color:var(--accent);font-weight:600}
.nav-sub .badge{margin-left:auto;font-size:10px;color:var(--muted);background:#f1f5f9;padding:1px 6px;border-radius:8px}

/* 主视图 */
.view{display:none}
.view.active{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.home h2{color:var(--brand);border-bottom:3px solid var(--brand);padding-bottom:8px}
.home .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:18px 0}
.home .stat{background:#fff;padding:14px;border-radius:10px;border:1px solid var(--line);text-align:center}
.home .stat .n{font-size:26px;font-weight:800;color:var(--brand)}
.home .stat .l{font-size:12px;color:var(--muted);margin-top:4px}
.home .tip{background:var(--accent-soft);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 6px 6px 0;font-size:13px;margin:14px 0}

.topic-title{font-size:22px;font-weight:800;margin:4px 0 12px;padding-bottom:10px;border-bottom:3px solid var(--brand)}
.topic-title .en{font-size:13px;color:var(--muted);font-weight:400;margin-left:10px}

/* 知识点卡片 */
.kp{background:#fff;border-radius:10px;padding:16px 20px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.kp h3{margin:0 0 8px;font-size:16px;color:var(--brand)}
.kp h3 .tag{font-size:11px;font-weight:400;background:var(--brand-soft);color:var(--brand);padding:2px 8px;border-radius:10px;margin-left:6px}
.kp h4{font-size:14px;margin:12px 0 6px;color:var(--accent)}
.kp ul{margin:6px 0;padding-left:22px}
.kp li{margin:3px 0}
.kp .latest{background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 6px 6px 0;font-size:13px;margin-top:10px}
.kp .latest b{color:var(--accent)}

/* 文档阅读视图 */
.doc-head{background:#fff;padding:16px 22px;border-radius:10px;border:1px solid var(--line);margin-bottom:14px}
.doc-head .meta{font-size:12px;color:var(--muted);margin-top:6px}
.doc-head .open-orig{display:inline-block;margin-top:8px;font-size:13px;background:var(--brand);color:#fff;padding:5px 12px;border-radius:6px}
.doc-body{background:#fff;padding:24px 30px;border-radius:10px;border:1px solid var(--line);font-size:14.5px;line-height:1.9;white-space:pre-wrap;word-break:break-word;max-width:900px}
.doc-body.scanned{background:#fffbeb;border:1px dashed #d97706}

/* 文件链接列表 */
.file-row{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;border-bottom:1px dotted #f1f5f9}
.file-row:last-child{border-bottom:0}
.file-ico{width:22px;height:22px;flex-shrink:0;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700}
.file-ico.doc{background:var(--doc)}
.file-ico.video{background:var(--vid)}
.file-ico.image{background:#059669}
.file-row a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-row .sz{font-size:11px;color:var(--muted);flex-shrink:0}
.file-section{background:#fff;padding:14px 18px;border-radius:10px;border:1px solid var(--line);margin-bottom:12px}
.file-section h4{margin:0 0 8px;color:var(--brand);font-size:14px}

/* 搜索结果 */
.search-hit{display:block;background:#fff;padding:12px 16px;border-radius:8px;margin-bottom:8px;border-left:3px solid var(--brand);cursor:pointer}
.search-hit:hover{background:#f0fdfa}
.search-hit .t{font-weight:600;font-size:14px}
.search-hit .s{font-size:12px;color:var(--muted);margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* 移动端 */
.menu-btn{display:none;position:fixed;left:12px;bottom:18px;z-index:60;background:var(--brand);color:#fff;border:none;width:46px;height:46px;border-radius:50%;font-size:20px;cursor:pointer;box-shadow:var(--shadow)}
@media (max-width:900px){
  aside{position:fixed;left:-300px;top:86px;bottom:0;z-index:40;transition:left .25s;box-shadow:4px 0 16px rgba(0,0,0,.1)}
  aside.show{left:0}
  main{padding:16px}
  .menu-btn{display:block}
  .dis-section{padding:14px !important}
  #view-disease > div[style*="grid"]{grid-template-columns:1fr !important}
}
</style>
</head>
<body>

<!-- 启动封面 -->
<div id="splash" style="position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .6s;overflow:hidden">
  <img src="cover.jpg" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kenburns 20s ease-in-out infinite alternate" alt="">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2) 0%,rgba(0,0,0,.55) 100%)"></div>

    <div style="font-size:13px;letter-spacing:10px;opacity:.85;margin-bottom:18px;animation:fadeUp 1.2s .2s both">REHABILITATION</div>
    <h1 style="font-size:54px;font-weight:800;margin:0;letter-spacing:5px;text-shadow:0 4px 30px rgba(0,0,0,.7);animation:fadeUp 1.2s .4s both">康复治疗学知识库</h1>
    <div style="width:0;height:2px;background:#fff;margin:22px auto;opacity:.8;animation:lineGrow 1s .8s forwards"></div>
    <p style="opacity:.9;font-size:16px;margin:0 0 44px;text-shadow:0 2px 10px rgba(0,0,0,.6);animation:fadeUp 1.2s .9s both">解剖 · 评定 · 疾病 · 治疗技术</p>
    <button onclick="enterApp()" style="padding:15px 60px;font-size:16px;letter-spacing:3px;background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.8);border-radius:30px;cursor:pointer;backdrop-filter:blur(10px);transition:all .3s;animation:fadeUp 1.2s 1.1s both,pulse 2.5s 2s infinite" onmouseover="this.style.background='rgba(255,255,255,.4)';this.style.transform='scale(1.05)'" onmouseout="this.style.background='rgba(255,255,255,.15)';this.style.transform=''">进入知识库 →</button>
  </div>
</div>
<style>
@keyframes kenburns{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.12) translate(-1%,1%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}
@keyframes lineGrow{to{width:80px}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.4)}50%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
</style>

</header>

<button class="menu-btn" onclick="document.querySelector('aside').classList.toggle('show')">☰</button>

<div class="wrap">

const KP_HTML = {"pnf": "\n<div class=\"kp\"><h3>螺旋对角模式 D1/D2 <span class=\"tag\">必考</span></h3>\n<p>身体每部位都有 D1、D2 两个对角线模式，含屈/伸、外展/内收、内外旋三成分。</p>\n<ul><li><b>D1屈</b>：肩前屈+内收+外旋，前臂旋后，腕掌屈桡偏——手伸嘴边、梳对侧头</li>\n<li><b>D1伸</b>：肩后伸+外展+内旋，前臂旋前，腕背伸尺偏——开车门、网球正手</li>\n<li><b>D2屈</b>：肩前屈+外展+外旋，前臂旋后，腕背伸桡偏——梳同侧头、仰泳</li>\n<li><b>D2伸</b>：肩后伸+内收+内旋，前臂旋前，腕掌屈尺偏——手摸对侧膝</li></ul></div>\n<div class=\"kp\"><h3>15种基本手法</h3>\n<ul><li><b>节律性发动</b>：被动→主动辅助→主动→轻抗阻，改善运动启动。</li>\n<li><b>收缩-放松</b>：拮抗肌等张抗阻后放松，增加被动ROM。</li>\n<li><b>保持-放松</b>：等长抗阻5-10秒后放松，用于疼痛性受限。</li>\n<li><b>拮抗肌反转</b>：主动/拮抗肌交替节律抗阻，改善协同。</li>\n<li>重复、时序叠加、组合运动、接触挤压等。</li></ul></div>\n<div class=\"kp\"><h3>治疗原则</h3>\n<p>从头→足、近端→远端；存在痉挛时先抑制痉挛→促拮抗肌→促姿势反射；利用非对称性紧张颈反射强化肌力。</p>\n<div class=\"latest\"><b>对应视频：</b>本目录13个.ts视频从概论到上肢/下肢/颈/躯干/步态/面瘫吞咽言语应用完整授课。</div></div>", "ot": "\n<div class=\"kp\"><h3>基本概念</h3>\n<p>作业(Occupation)指日常所做一切事——自我照顾、娱乐、生产贡献。OT不是练肌肉，而是<b>通过有意义的活动重塑人的角色与生活</b>。</p></div>\n<div class=\"kp\"><h3>三大理论模式 <span class=\"tag\">高频考点</span></h3>\n<ul><li><b>CMOP</b>：作业表现+作业构成+作业情景三部分。</li>\n<li><b>MOHO</b>：意向（兴趣/价值/自我效能）+习惯（习惯模式/角色/社会化）+作业能力。</li>\n<li><b>PEO</b>：人-环境-作业三者互动，重叠越大作业表现越好。</li></ul></div>\n<div class=\"kp\"><h3>OT干预手段</h3>\n<ul><li>ADL训练、治疗性作业活动（木工/编织/书法）</li>\n<li>辅助技术（自助具/加粗餐具/轮椅）</li>\n<li>环境改造（无障碍/扶手/智能家控）</li>\n<li>支具矫形器、职业康复、团体治疗</li></ul></div>\n<div class=\"kp\"><h3>专科OT</h3>\n<ul><li><b>脑卒中</b>：偏瘫侧上肢手功能、ADL再学习、忽略训练</li>\n<li><b>手外伤</b>：术后保护位、感觉再教育、渐进抓握</li>\n<li><b>帕金森</b>：节律提示、冻结步态策略</li>\n<li><b>失智</b>：确认疗法、怀旧疗法、结构化日常</li></ul>\n<div class=\"latest\"><b>视频：</b>本目录164个mp4系统授课。</div></div>", "rihen": "\n<div class=\"kp\"><h3>核心原理</h3>\n<p>脑卒中后瘫痪不是单纯肌无力，而是大脑运动程序与感觉反馈通路中断。RFE通过治疗师手法反复促通瘫痪侧上肢运动，强制使用患侧，诱导大脑皮质功能重组。</p>\n<p>与CIMT区别：RFE更强调治疗师手法引导，适用于早期、弛缓期即有微弱运动者。</p></div>\n<div class=\"kp\"><h3>上肢/下肢手法</h3>\n<p><b>上肢</b>：仰卧/坐位引导患侧肩外展外旋、肘伸、前臂旋后、腕背伸、拇指外展，配合口令反复抓起-释放。<br>\n<b>下肢</b>：屈髋屈膝踝背屈模式下反复踝背屈、迈步，配合RFE专用工具。每次20-40分钟。</p></div>\n<div class=\"kp\"><h3>适应证</h3>\n<ul><li><b>适应证</b>：脑卒中后上肢手功能障碍，Brunnstrom II期以上最佳。</li>\n<li><b>禁忌</b>：急性期生命体征不稳、严重认知障碍、严重痉挛(Ashworth≥3)、严重骨质疏松。</li></ul>\n<div class=\"latest\"><b>本地资料：</b>《反复促通疗法（川平法）的理论与实践》PDF（宫本明2022主译）+ 上肢/下肢手法PPT + 36个中文实操视频。</div></div>", "assess": "\n<div class=\"kp\"><h3>MMT徒手肌力（Lovett 0-5级）<span class=\"tag\">必背</span></h3>\n<ul><li><b>0级</b>：无可见/可感收缩</li>\n<li><b>1级</b>：可触及轻微收缩，无关节活动</li>\n<li><b>2级</b>：消除重力下全ROM运动</li>\n<li><b>3级</b>：抗重力全ROM，不能抗阻</li>\n<li><b>4级</b>：抗重力+中等阻力</li>\n<li><b>5级</b>：正常，抗充分阻力</li></ul>\n<div class=\"latest\"><b>注意：</b>中枢神经损伤痉挛明显时不宜用MMT，应改用Brunnstrom/FMA。</div></div>\n<div class=\"kp\"><h3>Brunnstrom六期 <span class=\"tag\">必考</span></h3>\n<ul><li><b>Ⅰ期</b>：弛缓，无随意运动</li>\n<li><b>Ⅱ期</b>：出现痉挛、联合反应、极微弱收缩</li>\n<li><b>Ⅲ期</b>：可随意引起共同运动，痉挛达峰</li>\n<li><b>Ⅳ期</b>：出现分离运动，痉挛减轻</li>\n<li><b>Ⅴ期</b>：分离运动进一步改善</li>\n<li><b>Ⅵ期</b>：共同运动消失，协调速度近正常</li></ul></div>\n<div class=\"kp\"><h3>Fugl-Meyer评定(FMA)</h3>\n<p>基于Brunnstrom的定量评定，113小项，每项0/1/2分，<b>总分226分</b>：运动100（上肢66+下肢34）、平衡14、感觉24、关节活动44、疼痛44。</p></div>\n<div class=\"kp\"><h3>Barthel指数(BI) <span class=\"tag\">必考</span></h3>\n<p>10项PADL，总分100：0-20极严重缺陷；25-45严重；50-70中度；75-95轻度；100完全自理。</p></div>\n<div class=\"kp\"><h3>FIM功能独立性</h3>\n<p>18项（运动13+认知5），每项7级，总分126：7完全独立/6有条件独立/5监护/4最小帮助(用力≥75%)/3中等(50-74%)/2最大(25-49%)/1完全依赖。儿童用WeeFIM。</p></div>\n<div class=\"kp\"><h3>其他量表</h3>\n<ul><li>改良Ashworth(MAS)：0/1/1+/2/3/4六级评痉挛</li>\n<li>Carr平衡、上田氏平衡、BBS、TUG</li>\n<li>Gesell发育、Bender视知觉、Rey-Osterrieth复杂图形</li>\n<li>ASIA脊髓损伤分级：A完全/B感觉不全/C运动不全关键肌&lt;3级/D≥3级/E正常</li></ul></div>", "gait": "\n<div class=\"kp\"><h3>外周神经损伤步态</h3>\n<ul><li><b>臀大肌步态（鹅步）</b>：伸髋无力，支撑相躯干后仰、腰前凸，前后摆动大。</li>\n<li><b>臀中肌步态（鸭步/Trendelenburg）</b>：支撑相骨盆向患侧下沉&gt;5°，双侧受累左右摇晃如鸭行。</li>\n<li><b>屈髋肌无力</b>：步幅明显缩短。</li>\n<li><b>股四头肌无力</b>：支撑相膝过伸以韧带代偿。</li>\n<li><b>踝背伸无力（跨阈/跨栏步态）</b>：足下垂，摆动相过度屈髋屈膝把脚\"跨\"过去。</li></ul></div>\n<div class=\"kp\"><h3>中枢神经损伤步态 <span class=\"tag\">高频</span></h3>\n<ul><li><b>偏瘫划圈步态</b>：患侧下肢伸肌痉挛+足内翻下垂，摆动相骨盆抬高、髋外展外旋，患肢向外划半圈。</li>\n<li><b>剪刀步态（脑瘫/截瘫）</b>：内收肌痉挛，两下肢交叉前移，足尖着地。</li>\n<li><b>共济失调步态</b>：步宽加大、左右摇晃如醉汉。</li>\n<li><b>帕金森慌张步态</b>：前倾、小碎步、越走越快、不能立即停。</li></ul>\n<div class=\"latest\"><b>临床思路：</b>先判责任期（支撑/摆动）→责任肌→反推神经平面。</div></div>", "dysphagia": "\n<div class=\"kp\"><h3>正常吞咽三时相</h3>\n<ul><li><b>口腔期</b>（随意）：唇闭锁、舌搅拌、形成食团</li>\n<li><b>咽期</b>（反射）：软腭上抬、喉上提、会厌反折、环咽肌开放</li>\n<li><b>食管期</b>：食管蠕动送入胃</li></ul></div>\n<div class=\"kp\"><h3>洼田饮水试验 <span class=\"tag\">必考</span></h3>\n<p>坐位饮30ml温水观察：</p>\n<ul><li><b>Ⅰ级</b>：一次喝完无呛咳（5秒内正常）</li>\n<li><b>Ⅱ级</b>：分两次喝完无呛咳（可疑）</li>\n<li><b>Ⅲ级</b>：一次喝完但呛咳</li>\n<li><b>Ⅳ级</b>：分两次以上喝完且呛咳</li>\n<li><b>Ⅴ级</b>：屡屡呛咳难以喝完</li></ul></div>\n<div class=\"kp\"><h3>反复唾液吞咽测试RSST</h3>\n<p>食指横置甲状软骨与舌骨间，嘱快速反复吞咽，记录30秒次数。正常≥3次，喉上抬充分。口干可舌面滴1ml水。</p></div>\n<div class=\"kp\"><h3>治疗技术 <span class=\"tag\">必背</span></h3>\n<ul><li><b>间接训练</b>：口颜面/唇舌/颌运动、声带内收、咳嗽、Shaker抬头、冰酸刺激</li>\n<li><b>直接训练</b>：坐直90°头前屈、食物增稠、一口量3-20ml</li>\n<li><b>门德尔松手法</b>：吞咽时主动保持喉上抬，扩大环咽肌开放</li>\n<li><b>声门上吞咽</b>：吞咽前屏气→吞咽→吞咽后立即咳嗽清除误吸</li>\n<li><b>用力吞咽</b>：用力吞咽增加舌骨上肌群收缩</li></ul>\n<div class=\"latest\"><b>金标准：</b>VFSS吞咽造影；FEES纤维内镜。并发症：卒中相关性肺炎、营养不良。</div></div>", "aphasia": "\n<div class=\"kp\"><h3>Benson失语分类 <span class=\"tag\">必考</span></h3>\n<h4>外侧裂周失语（共同特点：复述差）</h4>\n<ul><li><b>Broca失语（运动性/表达性）</b>：非流利电报式、理解相对好、复述差、病灶额下回后部。患者自知说不出，易抑郁。</li>\n<li><b>Wernicke失语（感觉性/接受性）</b>：流利但错语杂乱、理解极差、复述差、病灶颞上回后部。答非所问不自知。</li>\n<li><b>传导性失语</b>：流利、理解好、唯独复述极差（弓状束损伤）。</li></ul>\n<h4>分水岭失语（复述相对好）</h4>\n<ul><li>经皮质运动性(TCMA)、经皮质感觉性(TCSA)、经皮质混合性(MTCA)</li></ul>\n<h4>其他</h4>\n<ul><li><b>完全性失语</b>：听说读写全面严重受损</li>\n<li><b>命名性失语</b>：流利理解复述好，唯独命名不能（颞中回后部）</li></ul></div>\n<div class=\"kp\"><h3>常用评定</h3>\n<ul><li><b>BDAE波士顿</b>：5大项26分测验，全面但需2-3小时</li>\n<li><b>WAB西方失语成套</b>：1小时完成，算失语商AQ/操作商PQ/皮质商CQ</li>\n<li><b>SLTA日本标准</b>：听说读写计算26分测验</li>\n<li><b>ABC汉语失语检查法</b>：适合普通话</li></ul></div>\n<div class=\"kp\"><h3>治疗原则</h3>\n<p><b>Schuell刺激法</b>：强听觉刺激、多途径、反复、引出反应、正确强化。尽早开始、集中训练、结合日常。</p></div>", "dysarthria": "\n<div class=\"kp\"><h3>六种类型</h3>\n<ul><li><b>弛缓型</b>：下运动神经元（球麻痹），鼻音重、鼻漏气</li>\n<li><b>痉挛型</b>：上运动神经元（假性球麻痹），说话慢费力</li>\n<li><b>共济失调型</b>：小脑病变，节律异常爆发性语言</li>\n<li><b>运动过多型</b>：舞蹈症/肌张力障碍</li>\n<li><b>运动过少型</b>：帕金森，低平单调含糊</li>\n<li><b>混合型</b>：ALS、多发性硬化最常见</li></ul></div>\n<div class=\"kp\"><h3>Frenchay构音障碍评定 <span class=\"tag\">必考</span></h3>\n<p>8大项26分测验，9级评分：反射→呼吸→唇→颌→软腭→喉→舌→言语可理解度。观察静态与说话时运动，做鼓腮/咧嘴/伸舌/发a/i/u/读字读句。</p></div>\n<div class=\"kp\"><h3>训练要点</h3>\n<ul><li>呼吸：平稳呼气、一口气数到20</li>\n<li>口颜面：唇闭合/咧嘴/鼓腮/伸舌/卷舌/顶腮/下颌开合</li>\n<li>腭咽闭合：发\"啊\"、推掌发声减少鼻漏气</li>\n<li>发音语速：单音→音节→字词→句子</li>\n<li>代偿：放慢语速、加大音量、交流板</li></ul>\n<div class=\"latest\"><b>儿童功能性构音障碍</b>：本目录有14篇相关论文。</div></div>", "ptstroke": "\n<div class=\"kp\"><h3>五大神经促通技术</h3>\n<ul><li><b>Brunnstrom</b>：早期利用联合反应/共同运动诱发收缩，再训练分离</li>\n<li><b>Bobath(NDT)</b>：关键点控制+RIP抑制痉挛</li>\n<li><b>PNF</b>：螺旋对角模式促通</li>\n<li><b>Rood</b>：多感觉刺激（刷擦/冰/牵张/挤压）</li>\n<li><b>运动再学习MRP</b>：Carr/Shepherd，任务导向，日常动作拆解反复练习</li></ul></div>\n<div class=\"kp\"><h3>联合反应与共同运动 <span class=\"tag\">必考</span></h3>\n<ul><li><b>联合反应</b>：健肢用力时患肢不随意张力/运动。上肢：健肢屈→患肢屈；下肢Raimiste：健肢内收→患肢内收。</li>\n<li><b>上肢屈肌共同运动</b>：肩胛上提后缩、肩外展外旋、肘屈、前臂旋后、腕指屈</li>\n<li><b>上肢伸肌共同运动</b>：肩胛前伸下推、肩内收内旋、肘伸、前臂旋前</li>\n<li><b>下肢伸肌共同运动</b>：髋伸内收内旋、膝伸、踝跖屈内翻</li></ul>\n<div class=\"latest\"><b>临床意义：</b>Ⅲ期共同运动达峰，治疗目标是诱导Ⅳ-Ⅵ期分离运动，避免强化异常步态。</div></div>\n<div class=\"kp\"><h3>良肢位摆放</h3>\n<ul><li><b>仰卧位</b>：患侧肩垫枕前伸、肘伸腕背伸；髋垫枕防外旋、膝微屈、踝中立</li>\n<li><b>患侧卧位（最推荐）</b>：患侧上肢前伸肘伸掌心向上；患侧下肢伸，健腿屈髋屈膝垫枕</li>\n<li><b>健侧卧位</b>：患侧上肢垫枕前伸、下肢垫枕屈髋屈膝</li>\n<li>每2小时翻身防压疮挛缩</li></ul></div>\n<div class=\"kp\"><h3>肩手综合征(SHS)</h3>\n<p>卒中后1-3月高发：患肩痛、手水肿、皮温高、腕指活动受限。处理：避免牵拉患臂、抬高患肢、向心加压缠绕、冷热交替、必要时类固醇/星状神经节阻滞。</p></div>\n<div class=\"kp\"><h3>废用与误用综合征</h3>\n<ul><li><b>废用</b>：长期卧床致肌力下降、压疮、DVT、体位性低血压</li>\n<li><b>误用</b>：过早练走路、暴力牵拉致痉挛加重、划圈步态、肩痛</li>\n<li>痉挛管理：良肢位、被动牵伸、巴氯芬/替扎尼定、肉毒素、矫形器</li></ul></div>\n<div class=\"kp\"><h3>中医康复</h3>\n<p>本目录69篇PDF大量为针灸穴位埋线治疗中风偏瘫/失语/吞咽障碍/肩手综合征研究。常用穴：百会、长强、夹脊、肩髃、曲池、手三里、外关、合谷、环跳、阳陵泉、足三里、三阴交。</p></div>", "books": "\n<div class=\"kp\"><h3>核心教材</h3>\n<ul><li><b>《中国康复医学（第二版）》</b>：国内权威参考书</li>\n<li><b>《循序渐进——偏瘫患者的全面康复治疗（第2版）》</b>：Davies经典</li>\n<li><b>《实用PNF治疗·图解指南第4版》</b>：PNF实操</li>\n<li><b>CMSA（Chedoke-McMaster卒中评估）</b></li></ul></div>\n<div class=\"kp\"><h3>运动损伤与康复</h3>\n<ul><li>《运动损伤临床指南》《运动伤害图解圣经》</li>\n<li>《运动损伤康复治疗学（王予彬）》</li>\n<li>《运动损伤的评估与康复训练全书（2023全彩）》</li>\n<li>《运动康复指导·初级（邹志红2023）》</li></ul></div>\n<div class=\"kp\"><h3>NSCA体能训练体系</h3>\n<ul><li>《NSCA体能训练概论》《NSCA私人教练基础》</li>\n<li>《体能训练设计指南》《动态拉伸》《核心区训练》《灵敏训练》</li>\n<li>《运动员恢复指南》《运动员的时钟》</li></ul>\n<div class=\"latest\"><b>使用建议：</b>这些PDF多为几百MB彩图扫描版，适合查图查章；本知识库已把对应知识点提取成速查卡片。</div></div>"};

const DISEASES = {"stroke": {"name": "脑卒中（中风）", "overview": "急性脑血管事件后，按WHO标准：生命体征平稳、神经症状不再进展48小时后开始康复。中国指南推荐三级康复：急性期（14天内）→恢复期（2周-6月）→慢性期（6月后）。", "stages": [{"phase": "急性期（发病后14天内，一级康复）", "time": "卧床期，多在神经内科/急诊室", "assessment": ["入院24小时内首次评定：NIHSS神经功能缺损、意识(GCS)、吞咽(洼田饮水/VFSS)、皮肤、DVT风险、情绪", "卧床期每日床边评定：关节活动度、肌张力、良肢位是否正确", "发病72小时内：生命体征稳定后开始床边康复介入"], "treatment": ["良肢位摆放：患侧卧位为主，每2小时翻身一次", "关节被动活动：从近端到远端，每日2次，每次每个关节5-10遍", "床上体位转换：辅助翻身、床上坐起训练", "早期床边坐位：从30°→60°→90°，每次5-10分钟开始", "呼吸排痰：腹式呼吸、辅助咳嗽，预防坠积性肺炎", "吞咽管理：禁食或调整食物性状，防止误吸", "DVT预防：踝泵运动、弹力袜、必要时低分子肝素"]}, {"phase": "恢复期早期（2周-3月，二级康复）", "time": "转入康复医学科/康复中心，此阶段恢复最快", "assessment": ["转入后首次全面评定：Fugl-Meyer(FMA)、Brunnstrom分期、MAS、Berg平衡、BI指数", "每2周复评一次：FMA、BI，调整治疗方案", "发病1月时中期评定：判断恢复趋势、预后预测"], "treatment": ["床上训练：桥式运动、床上移动、翻身训练", "坐位平衡：一级(静态)→二级(自动态)→三级(他动态)", "站位训练：辅助站立→独站→患侧单腿负重", "步行训练：平行杠内→助行器→独立步行；减重步行训练(BWSTT)", "上肢训练：Brunnstrom/PNF/Bobath手法、强制运动疗法(CIMT)、川平法(RFE)", "物理因子：神经肌肉电刺激(NMES)、肌电生物反馈、rTMS经颅磁刺激", "作业治疗：ADL训练(穿衣/进食/如厕)、手功能精细动作", "言语吞咽：Schuell刺激法、门德尔松手法、Shaker训练"]}, {"phase": "恢复期后期-慢性期（3月以后，三级康复）", "time": "社区/家庭康复，终身管理", "assessment": ["发病3月、6月时复评：FMA、BI、FIM、生活质量(SF-36)", "跌倒风险：TUG计时起立行走、Berg平衡", "抑郁筛查：PHQ-9"], "treatment": ["强化残存功能：步行耐力、上下楼梯、户外行走", "ADL独立训练：做饭、购物、家务", "职业康复：回归工作岗位的适应性训练", "维持训练：每日30-60分钟有氧+力量，防止功能倒退", "家庭环境改造：扶手、防滑、坡道"]}], "complications": ["压疮：每2h翻身、减压床垫、保持皮肤干燥", "肩痛/肩关节半脱位/肩手综合征：早期避免牵拉患肩、良肢位、NMES电刺激", "DVT：踝泵、弹力袜、低分子肝素", "关节挛缩：持续被动活动、早期床上训练", "跌倒：平衡训练、环境改造", "吸入性肺炎：吞咽筛查、体位进食", "卒中后抑郁：PHQ-9筛查、心理干预"], "notes": ["生命体征稳定48小时后开始，避免早期高强度训练", "禁止用力牵拉患肩、禁止双手高举滑轮动作", "痉挛期避免暴力被动牵伸", "训练中头晕、胸痛、血压骤升立即停止", "家属教育与家庭训练同等重要"], "refs": [{"title": "中国脑卒中康复治疗指南(2011完全版)", "author": "中华医学会神经病学分会", "url": "https://guide.medlive.cn/guideline/3387"}, {"title": "中国脑卒中早期康复治疗指南", "author": "中华医学会", "url": "https://rs.yiigle.com/cmaid/992228"}, {"title": "中国脑血管病临床管理指南(第2版)·康复管理", "author": "中华医学会神经病学分会", "url": "https://d.wanfangdata.com.cn/periodical/zgzzzz202309010"}, {"title": "中国脑梗死急性期康复专家共识", "author": "中国康复医学会", "u /* ===== 删除列表（持久化） ===== */
const DEL_KEY = 'deleted_items';
function getDeleted(){ try{ return JSON.parse(localStorage.getItem(DEL_KEY)||'[]'); }catch(e){ return []; } }
function isDeleted(rel){ return getDeleted().includes(rel); }
function delItem(rel){
  if(!confirm('从页面里删除这个条目？（只删页面显示，不删电脑上的文件）')) return;
  const arr = getDeleted();
  if(!arr.includes(rel)) arr.push(rel);
  localStorage.setItem(DEL_KEY, JSON.stringify(arr));
  renderHome();
}

function renderDocsList(topicId){
  const t = topicById(topicId);
  const all = DOCS[t.dir] || [];
  const docs = all.filter(d=>!isDeleted(d.rel));

  let html = `<div class="topic-title">${t.name} · 评定量表（${docs.length}个，点击直接打开）</div>

  docs.forEach((d)=>{
    const url = 'file:///D:/康复/KF/' + encodeURI(t.dir) + '/' + encodeURI(d.rel.substring(t.dir.length+1));

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ===== 本地文件链接视图 ===== */
function renderFiles(topicId){
  const t = topicById(topicId);
  const raw = FILES[t.dir] || {doc:[],video:[],image:[]};
  const files = {
    doc: (raw.doc||[]).filter(f=>!isDeleted(f.rel)),
    image: (raw.image||[]).filter(f=>!isDeleted(f.rel)),
  };
  const v = document.getElementById('view-files');
  let html = `<div class="topic-title">${t.name} · 原文件（文档与图片）</div>`;
  const renderGroup = (title, arr, kind)=>{
    if(!arr.length) return '';
    let rows = arr.map(f=>{
      const url = 'file:///D:/康复/KF/' + encodeURI(t.dir) + '/' + encodeURI(f.rel.substring(t.dir.length+1));
      return `<div class="file-row" style="position:relative">
        <span class="file-ico ${kind}">${kind==='doc'?'文':'图'}</span>
        <a href="${url}" title="${f.name}">${f.name}</a>
        <span class="sz">${f.sizeMB}MB</span>
        <button onclick="delItem('${f.rel.replace(/'/g,"\\'")}')" style="margin-left:auto;background:#fee2e2;color:#dc2626;border:none;border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer">删除</button>
      </div>`;
    }).join('');
    return `<div class="file-section"><h4>${title}（${arr.length}）</h4>${rows}</div>`;
  };
  html += renderGroup('📄 文档（PDF/Word/PPT原文件）', files.doc, 'doc');
  html += renderGroup('🖼 图片', files.image, 'image');
  v.innerHTML = html;
  show('files');
}

/* ===== 我的分享（图片+视频，存IndexedDB） ===== */
let shareDB = null;
function openShareDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open('shareDB', 1);
    req.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('items')) db.createObjectStore('items', {keyPath:'id', autoIncrement:true});
    };
    req.onsuccess = e=>{ shareDB = e.target.result; resolve(shareDB); };
    req.onerror = e=>reject(e);
  });
}
function dbAddItem(item){
  return new Promise((resolve, reject)=>{
    const tx = shareDB.transaction('items','readwrite');
    tx.objectStore('items').add(item);
    tx.oncomplete = ()=>resolve();
    tx.onerror = e=>reject(e);
  });
}
function dbGetAll(){
  return new Promise((resolve, reject)=>{
    const tx = shareDB.transaction('items','readonly');
    const req = tx.objectStore('items').getAll();
    req.onsuccess = ()=>resolve(req.result||[]);
    req.onerror = e=>reject(e);
  });
}
function dbDeleteItem(id){
  return new Promise((resolve, reject)=>{
    const tx = shareDB.transaction('items','readwrite');
    tx.objectStore('items').delete(id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = e=>reject(e);
  });
}
function dbClear(){
  return new Promise((resolve, reject)=>{
    const tx = shareDB.transaction('items','readwrite');
    tx.objectStore('items').clear();
    tx.oncomplete = ()=>resolve();
    tx.onerror = e=>reject(e);
  });
}
let shareItems = [];
async function renderShare(){
  if(!shareDB) await openShareDB();
  shareItems = await dbGetAll();
  const v = document.getElementById('view-share');
  let html = `
    <div class="topic-title">📸 我的分享<span class="en">上传图片/视频，存在本机浏览器里</span></div>
    <div style="background:#fff7ed;padding:14px 18px;border-radius:8px;margin-bottom:16px;font-size:13.5px;line-height:1.7;color:#9a3412">
      <b>使用说明：</b>点下面按钮选本地图片或视频，自动存在这个浏览器里（下次打开还在）。
      <br>图片单张≤5MB，视频单段≤100MB。点"导出分享版HTML"把图片打包成网页发别人看；视频太大不嵌入HTML，会单独导出视频文件。
    </div>
    <div style="margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap">
      <label style="background:#2563eb;color:#fff;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px">
        📷 图片/视频上传
        <input type="file" accept="image/*,video/*" multiple style="display:none" id="share-file">
      </label>
      <label style="background:#7c3aed;color:#fff;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px">
        📄 我的文献(PDF/Word)
        <input type="file" accept=".pdf,.doc,.docx" multiple style="display:none" id="share-pdf">
      </label>
      <button onclick="exportShareHTML()" style="background:#059669;color:#fff;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:14px">📦 导出分享版</button>
      <button onclick="clearShare()" style="background:#dc2626;color:#fff;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-size:14px">🗑 清空全部</button>
    </div>
    <div id="share-wall" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px">
  `;
  if(shareItems.length===0){
    html += `<div style="grid-column:1/-1;text-align:center;padding:60px;color:#999">还没有上传，点上面按钮开始</div>`;
  } else {
    for(const it of shareItems){
      const url = URL.createObjectURL(it.blob);
      const isDoc = it.name.endsWith('.pdf') || it.name.endsWith('.doc') || it.name.endsWith('.docx');
      const media = isDoc
        ? `<div style="width:100%;height:140px;background:linear-gradient(135deg,#fef3c7,#fde68a);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;cursor:pointer" onclick="window.open('${url}','_blank')">📄</div>`
        : it.type.startsWith('video/')
        ? `<video src="${url}" controls style="width:100%;height:140px;object-fit:cover;background:#000"></video>`
        : `<img src="${url}" style="width:100%;height:140px;object-fit:cover;cursor:pointer" onclick="window.open('${url}','_blank')">`;
      html += `
        <div style="background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative">
          ${media}
          <div style="padding:8px;font-size:12px;color:#666;word-break:break-all">${it.name} <span style="color:#999">(${(it.blob.size/1024/1024).toFixed(1)}MB)</span></div>
          <button onclick="delShare(${it.id})" style="position:absolute;top:4px;right:4px;background:rgba(220,38,38,.9);color:#fff;border:none;border-radius:50%;width:24px;height:24px;cursor:pointer">×</button>
        </div>`;
    }
  }
  html += `</div>`;
  v.innerHTML = html;
  show('share');
  updateShareCount();
  document.getElementById('share-file').onchange = async e=>{
    const files = Array.from(e.target.files);
    for(const f of files){
      const isImg = f.type.startsWith('image/');
      const isVid = f.type.startsWith('video/');
      if(!isImg && !isVid) continue;
      if(isImg && f.size > 5*1024*1024){ alert(`图片 ${f.name} 超过5MB，跳过`); continue; }
      if(isVid && f.size > 100*1024*1024){ alert(`视频 ${f.name} 超过100MB，跳过`); continue; }
      await dbAddItem({name:f.name, type:f.type, blob:f, time:Date.now()});
    }
    renderShare();
  };
  document.getElementById('share-pdf').onchange = async e=>{
    const files = Array.from(e.target.files);
    for(const f of files){
      await dbAddItem({name:f.name, type:f.type, blob:f, time:Date.now()});
    }
    renderShare();
  };
}
async function delShare(id){
  if(!confirm('删除这个文件？')) return;
  await dbDeleteItem(id);
  renderShare();
}
async function clearShare(){
  if(!confirm('确定清空全部？不可恢复')) return;
  await dbClear();
  renderShare();
}
async function exportShareHTML(){
  const items = await dbGetAll();
  if(items.length===0){ alert('还没有文件'); return; }
  // 图片转base64嵌入，视频提示单独导出
  const imgs = items.filter(i=>i.type.startsWith('image/'));
  const vids = items.filter(i=>i.type.startsWith('video/'));
  let imgHtml = '';
  for(const it of imgs){
    const b64 = await new Promise(res=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result);
      r.readAsDataURL(it.blob);
    });
    imgHtml += `<figure style="display:inline-block;margin:8px;text-align:center">
      <img src="${b64}" style="max-width:320px;max-height:240px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15)">
      <figcaption style="font-size:12px;color:#666;margin-top:4px">${it.name}</figcaption></figure>`;
  }
  let note = '';
  if(vids.length>0){
    note = `<p style="color:#9a3412;background:#fff7ed;padding:10px;border-radius:6px">⚠️ 有 ${vids.length} 个视频未嵌入HTML（太大）。请把视频文件单独发给好友，和这个HTML放同一文件夹，改名为 video1.mp4 等即可。</p>`;
  }
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>我的分享 · ${imgs.length}图${vids.length}视频</title>
  <style>body{font-family:sans-serif;max-width:900px;margin:30px auto;padding:0 20px;background:#f8fafc}
  h1{color:#2563eb}</style></head><body>
  <h1>📸 我的分享</h1><p style="color:#666">共${imgs.length}张图片${vids.length}个视频</p>${note}<div>${imgHtml}</div></body></html>`;
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '我的分享.html';
  a.click();
  if(vids.length>0){
    alert(`已导出HTML。还有${vids.length}个视频文件太大，请到"我的分享"页手动复制视频文件发给好友。`);
  }
}
function updateShareCount(){
  const n = shareItems.length;
  const cnt = document.querySelector('.nav-group:last-child .cnt');
  if(cnt) cnt.textContent = n;
}

/* ===== 解剖与肌肉视图 ===== */
function renderMuscle(region){
  const v = document.getElementById('view-muscle');
  const regions = ['上肢','下肢','躯干'];
  const tabs = regions.map(r=>`<button onclick="renderMuscle('${r}')" style="${region===r?'background:#2563eb;color:#fff':'background:#f1f5f9;color:#475569'};border:none;padding:6px 16px;margin-right:6px;border-radius:6px;cursor:pointer;font-size:13px">${r}</button>`).join('');
  const list = region ? MUSCLES.filter(m=>m.region===region) : MUSCLES;
  let html = `<div class="topic-title">🦴 解剖与肌肉 · 康复常用${list.length}块<span class="en">起止点 / 作用 / 神经支配 / MMT检查体位</span></div>
  <div style="margin:10px 0 16px">${tabs}<button onclick="renderMuscle('')" style="${!region?'background:#2563eb;color:#fff':'background:#f1f5f9;color:#475569'};border:none;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:13px">全部</button></div>`;
  const groups = {};
  list.forEach(m=>{
    if(!groups[m.group]) groups[m.group] = [];
    groups[m.group].push(m);
  });
  for(const [g, items] of Object.entries(groups)){
    html += `<h3 style="margin:16px 0 8px;color:#1e40af;font-size:15px;border-left:4px solid #2563eb;padding-left:10px">${g}（${items.length}块）</h3>`;
    html += `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;background:#fff;font-size:12.5px">
      <thead><tr style="background:#eff6ff">
        <th style="padding:6px;border:1px solid #dbeafe;text-align:left">肌肉</th>
        <th style="padding:6px;border:1px solid #dbeafe;text-align:left">起点</th>
        <th style="padding:6px;border:1px solid #dbeafe;text-align:left">止点</th>
        <th style="padding:6px;border:1px solid #dbeafe;text-align:left">作用</th>
        <th style="padding:6px;border:1px solid #dbeafe;text-align:left">神经支配</th>
        <th style="padding:6px;border:1px solid #dbeafe;text-align:left">MMT检查</th>
      </tr></thead><tbody>`;
    items.forEach(m=>{
      html += `<tr>
        <td style="padding:6px;border:1px solid #e5e7eb;font-weight:600;color:#1e40af">${m.name}</td>
        <td style="padding:6px;border:1px solid #e5e7eb">${m.origin}</td>
        <td style="padding:6px;border:1px solid #e5e7eb">${m.insertion}</td>
        <td style="padding:6px;border:1px solid #e5e7eb">${m.action}</td>
        <td style="padding:6px;border:1px solid #e5e7eb;color:#059669">${m.nerve}</td>
        <td style="padding:6px;border:1px solid #e5e7eb;color:#92400e">${m.mmt}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }
  v.innerHTML = html;
  show('muscle');
}

/* ===== 搜索 ===== */
const searchBox = document.getElementById('search');
searchBox.addEventListener('input', e=>{
  const q = e.target.value.trim().toLowerCase();
  if(!q){ document.querySelector('.nav-group.open')||null; renderHome(); show('home'); return; }
  const v = document.getElementById('view-search');
  let hits = [];
  // 搜知识点精讲
  TOPICS.forEach(t=>{
    const kpHtml = KP_HTML[t.id]||'';
    if(kpHtml.toLowerCase().includes(q)){
      hits.push({type:'kp', topic:t.id, title:t.name+' · 知识点精讲', snippet:kpHtml.replace(/<[^>]+>/g,' ').slice(0,100)});
    }
  });
  // 搜文档
  TOPICS.forEach(t=>{
    (DOCS[t.dir]||[]).forEach((d,i)=>{
      if(d.name.toLowerCase().includes(q) || d.text.toLowerCase().includes(q)){
        const idx = d.text.toLowerCase().indexOf(q);
        const ctx = idx>=0 ? d.text.slice(Math.max(0,idx-40), idx+80).replace(/\s+/g,' ') : d.text.slice(0,80).replace(/\s+/g,' ');
        hits.push({type:'doc', topic:t.id, idx, title:d.name, snippet:ctx});
      }
    });
  });
  let html = `<div class="topic-title">搜索：「${e.target.value}」· ${hits.length} 个结果</div>`;
  hits.slice(0,50).forEach(h=>{
    html += `<div class="search-hit" onclick="${h.type==='doc'?`openDoc('${h.topic}',${h.idx})`:`renderKP('${h.topic}')`}">
      <div class="t">${h.title}</div>
      <div class="s">${h.snippet}…</div></div>`;
  });
  if(hits.length===0) html += '<p style="color:var(--muted);padding:30px;text-align:center">无匹配结果</p>';
  v.innerHTML = html;
  show('search');
});

/* ===== 左侧导航点击 ===== */
document.addEventListener('click', e=>{
  const sub = e.target.closest('.nav-sub');
  if(!sub) return;
  document.querySelectorAll('.nav-sub').forEach(s=>s.classList.remove('active'));
  sub.classList.add('active');
  const view = sub.dataset.view;
  const top = sub.dataset.top;
  if(view==='kp') renderKP(top);
  else if(view==='docs-list') renderDocsList(top);
  else if(view==='files') renderFiles(top);
  else if(view==='disease') renderDisease(sub.dataset.disease);
  else if(view==='share') renderShare();
  else if(view==='muscle') renderMuscle(sub.dataset.region);
  if(window.innerWidth<=900) document.querySelector('aside').classList.remove('show');
});

/* ===== 启动 ===== */
renderHome();
</script>
